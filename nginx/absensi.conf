# ==============================================================================
# Nginx Reverse Proxy Configuration for Absensi-Module (ZieeBot)
# Optimized for Port 3001, HTTPS-ready, Security-hardened, WebSocket Compliant
# ==============================================================================

# Gzip Compression Configuration to speed up Dashboard UI load times
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

# HTTP Server - Auto-redirect all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name absensi.yourdomain.com; # REPLACE WITH YOUR VPS IP OR DOMAIN NAME

    # Let's Encrypt / Certbot Webroot validation directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Production Hardened SSL/TLS reverse proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name absensi.yourdomain.com; # REPLACE WITH YOUR VPS IP OR DOMAIN NAME

    # SSL Certificate Paths - Ganti path dengan sertifikat Let's Encrypt Anda
    ssl_certificate /etc/letsencrypt/live/absensi.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/absensi.yourdomain.com/privkey.pem;

    # High-Security SSL Protocol Suites & Ciphers (TLS 1.2 & TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OWASP-Compliant Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Limit request payload sizes (security buffer against payload injection)
    client_max_body_size 10M;

    # Proxy to Absensi-Module Backend Express Server
    location / {
        # Port 3001 is mapped. Modify 'localhost' to the docker container service name 
        # (e.g. http://absensi-app:3001) if running within the same Docker network.
        proxy_pass http://localhost:3001; 
        proxy_http_version 1.1;
        
        # Connection and Upgrade headers setup for WebSocket compliance
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Client IP Forwarding Headers (Imperative for brute-force rate limiter)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive and read timeouts for Playwright's automation workloads
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }
}
