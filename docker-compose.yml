version: '3.8'

services:
  absensi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: absensi-service
    restart: always
    ports:
      - "3001:3001"
    volumes:
      # Persistent storage bindings for production data integrity
      - ./data:/usr/src/app/data
      - ./logs:/usr/src/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      # Automated application-level health validation
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # Hard limit to prevent host-level out of memory issues
          memory: 450M
